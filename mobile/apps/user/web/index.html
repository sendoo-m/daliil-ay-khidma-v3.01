<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="اكتشف أفضل الخدمات والمحلات والعروض القريبة منك">
  <title>دليل أي خدمة</title>
  <base href="$FLUTTER_BASE_HREF">
  <link rel="manifest" href="manifest.json">

  <!--
    خريطة صفحة الاستكشاف (MapDiscoveryPage) تستخدم حزمة maplibre_gl، واللي
    على الويب بتعتمد على مكتبة MapLibre GL JS محمّلة من CDN — الحزمة نفسها
    ما بتقدرش تحقن هذه الوسوم تلقائيًا. من غيرها الخريطة بتفضل شاشة بيضاء
    مع خطأ JS صامت (maplibregl is undefined).
  -->
  <script src='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css' rel='stylesheet'/>
  <script src="https://unpkg.com/pmtiles@4.4.0/dist/pmtiles.js"></script>

  <style>
    body { margin: 0; background: #F8FAFC; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center;
            font-family: system-ui, sans-serif; color: #64748B; font-size: 14px; }
  </style>
</head>
<body>
  <div id="boot">جارٍ التحميل…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot'); if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
