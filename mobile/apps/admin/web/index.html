<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لوحة إدارة دليل أي خدمة">
  <title>دليل أي خدمة — الإدارة</title>
  <base href="$FLUTTER_BASE_HREF">
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #EFF2F1; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      font-family: system-ui, sans-serif; color: #5A6E70; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="boot">جارٍ التحميل…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
