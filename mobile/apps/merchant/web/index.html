<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="إدارة نشاطك على دليل أي خدمة">
  <title>دليل أي خدمة — نشاطي</title>
  <base href="$FLUTTER_BASE_HREF">
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F2F4F0; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center;
            font-family: system-ui, sans-serif; color: #6B7268; font-size: 14px; }
  </style>
</head>
<body>
  <div id="boot">جارٍ التحميل…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot'); if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
