{% extends 'dashboard/base.html' %}
{% load i18n %}

{% block title %}حذف {{ product.name_ar }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white fw-bold"><i class="fas fa-trash me-2"></i>تأكيد الحذف</div>
      <div class="card-body text-center py-4">
        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
        <h4>هل تريد حذف هذا المنتج؟</h4>
        <p class="text-muted">{{ product.name_ar|default:product.name_en }}</p>
        <p class="small text-danger">لا يمكن التراجع عن هذا الإجراء.</p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-3">
          {% csrf_token %}
          <a href="{% url 'dashboard:product_list' %}" class="btn btn-outline-secondary px-4">إلغاء</a>
          <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-1"></i>تأكيد الحذف</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
