{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول الموظفين — دليل أي خدمة</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
  body{background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  .shell{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card-login{width:100%;max-width:400px;border:1px solid #e5e9f2;border-radius:16px;background:#fff}
  .brand{background:#16333b;color:#fff;border-radius:16px 16px 0 0;padding:28px 24px}
  .brand h1{font-size:22px;font-weight:700;margin:0}
  .brand p{margin:6px 0 0;font-size:13px;color:#9db5ab}
  .body{padding:24px}
  .form-label{font-size:13px;font-weight:600;color:#334155}
  .btn-go{background:#16333b;border:none;padding:12px;font-weight:600}
  .btn-go:hover{background:#1e4a3e}
  .hint{font-size:12.5px;color:#64748b;line-height:1.8;margin-top:18px;padding-top:16px;border-top:1px solid #eef2f7}
</style>
</head>
<body>
<div class="shell">
  <div class="card-login">
    <div class="brand">
      <h1>لوحة الإدارة</h1>
      <p>دليل أي خدمة — دخول الموظفين</p>
    </div>
    <div class="body">
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-danger py-2 px-3" style="font-size:13px;line-height:1.8">{{ m }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" autocomplete="on">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="username">اسم المستخدم</label>
          <input class="form-control" id="username" name="username" value="{{ username|default:'' }}" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">كلمة المرور</label>
          <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-go w-100 text-white" type="submit">دخول</button>
      </form>

      <p class="hint">
        الصفحة دي للموظفين. لو عندك محل أو خدمة، استعمل تطبيق الأنشطة.
      </p>
    </div>
  </div>
</div>
</body>
</html>
