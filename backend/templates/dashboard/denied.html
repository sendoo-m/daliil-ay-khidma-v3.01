{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير مسموح</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<style>
  body{background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  .shell{min-height:100vh;display:grid;place-items:center;padding:24px}
  .box{max-width:440px;background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:32px;text-align:center}
  .bar{width:44px;height:3px;background:#b23a2e;margin:0 auto 20px}
  h1{font-size:19px;font-weight:700;color:#16333b}
  p{color:#64748b;font-size:14px;line-height:1.9;margin:12px 0 0}
  .role{font-size:12.5px;color:#94a3b8;margin-top:18px;padding-top:14px;border-top:1px solid #eef2f7}
</style>
</head>
<body>
<div class="shell">
  <div class="box">
    <div class="bar"></div>
    <h1>الصفحة دي مش متاحة لدورك</h1>
    <p>{{ message }}</p>
    <p class="role">
      {% if request.user.staff_profile %}دورك: {{ request.user.staff_profile.role.name_ar }}{% endif %}
    </p>
    <a class="btn btn-outline-secondary mt-3" href="{% url 'dashboard:index' %}">ارجع للرئيسية</a>
  </div>
</div>
</body>
</html>
