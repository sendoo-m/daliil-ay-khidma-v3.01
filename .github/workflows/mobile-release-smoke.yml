name: Mobile Release Smoke

on:
  pull_request:
    paths:
      - 'mobile/apps/user/**'
      - 'mobile/apps/merchant/**'
      - 'mobile/packages/dalil_core/**'
      - '.github/workflows/mobile-release-smoke.yml'
  workflow_dispatch:

jobs:
  release-identity:
    name: Release identity guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify v1 metadata
        run: |
          grep -q '^version: 1.0.0+1$' mobile/apps/user/pubspec.yaml
          grep -q '^version: 1.0.0+1$' mobile/apps/merchant/pubspec.yaml
          grep -q 'applicationId = "com.daliilaykhidma.dalil_app"' mobile/apps/user/android/app/build.gradle.kts
          grep -q 'applicationId = "com.daliilaykhidma.merchant"' mobile/apps/merchant/android/app/build.gradle.kts
          grep -q 'android:label="دليل أي خدمة"' mobile/apps/user/android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="دليل أي خدمة - الأعمال"' mobile/apps/merchant/android/app/src/main/AndroidManifest.xml

  android-release:
    name: Android release AAB (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Java diagnostics
        run: |
          java -version
          javac -version

      - name: Dependencies
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter pub get

      - name: Create ephemeral CI upload key
        working-directory: mobile/apps/${{ matrix.app }}/android
        run: |
          keytool -genkeypair \
            -keystore ci-upload-key.jks \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=CI Release Smoke, OU=CI, O=Daliil Ay Khidma, L=Riyadh, ST=Riyadh, C=SA"
          cat > key.properties <<'EOF'
          storePassword=ci-release-pass
          keyPassword=ci-release-pass
          keyAlias=upload
          storeFile=../ci-upload-key.jks
          EOF

      - name: Build release app bundle
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://daliil-ay-khidma.onrender.com

      - name: Verify AAB exists
        working-directory: mobile/apps/${{ matrix.app }}
        run: test -s build/app/outputs/bundle/release/app-release.aab

  ios-smoke:
    name: iOS simulator debug smoke (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter pub get

      # Flutter does not support release mode for iOS Simulator. A debug
      # simulator build still validates Dart compilation, iOS plugins,
      # Xcode project integration and the generated bundle identity without
      # requiring an Apple Development Team/provisioning profile.
      - name: Build iOS simulator smoke without signing
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build ios --debug --simulator --dart-define=API_BASE_URL=https://daliil-ay-khidma.onrender.com

      - name: Verify iOS simulator app identity
        working-directory: mobile/apps/${{ matrix.app }}
        shell: bash
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist)
          if [ "${{ matrix.app }}" = "user" ]; then
            expected='com.daliilaykhidma.dalilApp'
          else
            expected='com.daliilaykhidma.merchant'
          fi
          echo "Bundle ID: $actual"
          test "$actual" = "$expected"
