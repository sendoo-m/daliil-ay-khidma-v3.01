name: Deploy web demos

# ينشر تطبيقين من مستودع واحد على GitHub Pages:
#   تطبيق المستخدم  →  /daliil-ay-khidma-v3.01/
#   تطبيق الإدارة   →  /daliil-ay-khidma-v3.01/admin/
#
# الحيلة: Pages تخدم موقعًا واحدًا لكل مستودع، فنبني كل تطبيق
# بـ base-href مختلف ونضع الإدارة في مجلد فرعي داخل نفس المنتج.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # عدّل هذين السطرين فقط لو غيّرت اسم المستودع أو الخادم.
  REPO_PATH: /daliil-ay-khidma-v3.01
  API_BASE_URL: https://daliil-ay-khidma.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare output
        run: mkdir -p _site

      # ── تطبيق المستخدم → الجذر ──────────────────────
      - name: Build user app
        working-directory: mobile/apps/user
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "${{ env.REPO_PATH }}/" \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Stage user app
        run: cp -r mobile/apps/user/build/web/. _site/

      # ── تطبيق الإدارة → /admin/ ─────────────────────
      - name: Build admin app
        working-directory: mobile/apps/admin
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "${{ env.REPO_PATH }}/admin/" \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Stage admin app
        run: |
          mkdir -p _site/admin
          cp -r mobile/apps/admin/build/web/. _site/admin/

      - name: Add SPA fallbacks
        run: |
          # Pages ترجّع 404 لأي مسار عميق. نسخة من index.html تعالج ذلك.
          cp _site/index.html _site/404.html
          cp _site/admin/index.html _site/admin/404.html
          # يمنع Jekyll من تجاهل الملفات التي تبدأ بشرطة سفلية.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
