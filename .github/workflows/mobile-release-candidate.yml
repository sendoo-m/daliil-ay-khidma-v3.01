name: Mobile Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Release candidate label
        required: true
        default: rc1

jobs:
  android-rc:
    name: Android RC AAB (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter pub get
      - name: Create ephemeral RC signing key
        working-directory: mobile/apps/${{ matrix.app }}/android
        run: |
          keytool -genkeypair -keystore ci-upload-key.jks -storepass ci-release-pass -keypass ci-release-pass -alias upload -keyalg RSA -keysize 2048 -validity 2 -dname "CN=RC CI, OU=Release, O=Daliil Ay Khidma, L=Riyadh, ST=Riyadh, C=SA"
          cat > key.properties <<'EOF'
          storePassword=ci-release-pass
          keyPassword=ci-release-pass
          keyAlias=upload
          storeFile=../ci-upload-key.jks
          EOF
      - name: Build release AAB
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://daliil-ay-khidma.onrender.com
      - name: Stage artifact
        run: |
          mkdir -p release-artifacts
          cp mobile/apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab release-artifacts/daliil-${{ matrix.app }}-${{ inputs.release_label }}.aab
          sha256sum release-artifacts/*.aab > release-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: daliil-${{ matrix.app }}-android-${{ inputs.release_label }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  ios-rc-smoke:
    name: iOS RC no-codesign (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter pub get
      - name: Build iOS release without signing
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://daliil-ay-khidma.onrender.com
      - name: Verify app and bundle identity
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          test -d build/ios/iphoneos/Runner.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)
          if [ "${{ matrix.app }}" = "user" ]; then expected='com.daliilaykhidma.dalilApp'; else expected='com.daliilaykhidma.merchant'; fi
          test "$actual" = "$expected"
      - name: Package unsigned diagnostic artifact
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent mobile/apps/${{ matrix.app }}/build/ios/iphoneos/Runner.app release-artifacts/daliil-${{ matrix.app }}-ios-unsigned-${{ inputs.release_label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: daliil-${{ matrix.app }}-ios-unsigned-${{ inputs.release_label }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
