name: Mobile Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Release candidate label
        required: true
        default: rc1

jobs:
  android-rc:
    name: Android RC AAB (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter pub get
      - name: Restore real upload keystore
        working-directory: mobile/apps/${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets[format('ANDROID_{0}_KEYSTORE_BASE64', matrix.app == 'user' && 'USER' || 'MERCHANT')] }}
          KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEYSTORE_PASSWORD', matrix.app == 'user' && 'USER' || 'MERCHANT')] }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_${{ matrix.app == 'user' && 'USER' || 'MERCHANT' }}_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/${{ matrix.app }}-upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=../keystore/${{ matrix.app }}-upload-keystore.jks
          EOF
      - name: Build release AAB
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://dalilaykhidma.com
      - name: Print signing certificate fingerprint
        working-directory: mobile/apps/${{ matrix.app }}/android
        run: keytool -list -v -keystore keystore/${{ matrix.app }}-upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias upload | grep -E "SHA256:|SHA1:|Owner:"
        env:
          KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_{0}_KEYSTORE_PASSWORD', matrix.app == 'user' && 'USER' || 'MERCHANT')] }}
      - name: Stage artifact
        run: |
          mkdir -p release-artifacts
          cp mobile/apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab release-artifacts/daliil-${{ matrix.app }}-${{ inputs.release_label }}.aab
          sha256sum release-artifacts/*.aab > release-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: daliil-${{ matrix.app }}-android-${{ inputs.release_label }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  # NOTE: this job builds an UNSIGNED .app for compile/identity verification only.
  # It does not produce a TestFlight/App Store-ready .ipa. Real signing needs an
  # Apple Distribution certificate + provisioning profiles from an Apple Developer
  # account, which are not yet configured as repo secrets.
  ios-rc-smoke:
    name: iOS RC no-codesign (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, merchant]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter pub get
      - name: Build iOS release without signing
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://dalilaykhidma.com
      - name: Verify app and bundle identity
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          test -d build/ios/iphoneos/Runner.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)
          if [ "${{ matrix.app }}" = "user" ]; then expected='com.daliilaykhidma.dalilApp'; else expected='com.daliilaykhidma.merchant'; fi
          test "$actual" = "$expected"
      - name: Package unsigned diagnostic artifact
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent mobile/apps/${{ matrix.app }}/build/ios/iphoneos/Runner.app release-artifacts/daliil-${{ matrix.app }}-ios-unsigned-${{ inputs.release_label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: daliil-${{ matrix.app }}-ios-unsigned-${{ inputs.release_label }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
