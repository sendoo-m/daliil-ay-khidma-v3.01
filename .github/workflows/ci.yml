name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mobile/packages/dalil_core
          - mobile/apps/admin
          - mobile/apps/merchant
          - mobile/apps/user
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Format check
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed . || echo "::warning::ملفات تحتاج dart format ."

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            flutter test
          else
            echo "لا توجد اختبارات في ${{ matrix.package }}"
          fi

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify mobile store foundations
        run: |
          test -d mobile/apps/user/android
          test -d mobile/apps/user/ios
          test -d mobile/apps/merchant/android
          test -d mobile/apps/merchant/ios

          if grep -q 'signingConfigs.getByName("debug")' mobile/apps/user/android/app/build.gradle.kts; then
            echo "::error::User release build must never use the debug signing key."
            exit 1
          fi

          if grep -q "defaultValue: 'http://10.0.2.2:8000'" mobile/apps/user/lib/core/config/environment.dart; then
            echo "::error::Distributed user builds must not default to the Android emulator API."
            exit 1
          fi

          grep -q 'applicationId = "com.daliilaykhidma.dalil_app"' mobile/apps/user/android/app/build.gradle.kts
          grep -q 'applicationId = "com.daliilaykhidma.merchant"' mobile/apps/merchant/android/app/build.gradle.kts
          grep -q 'android:label="دليل أي خدمة"' mobile/apps/user/android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="دليل أي خدمة - الأعمال"' mobile/apps/merchant/android/app/src/main/AndroidManifest.xml

  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: 'False'
      DATABASE_URL: sqlite:///ci.sqlite3
      ALLOWED_HOSTS: '*'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System check
        working-directory: backend
        run: python manage.py check

      - name: Migrations are complete
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        working-directory: backend
        run: python manage.py test --noinput
