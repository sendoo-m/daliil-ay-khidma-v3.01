name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      # لا نلغي بقية المصفوفة عند فشل واحد — نريد رؤية كل الأخطاء
      # في تشغيل واحد بدل اكتشافها واحدة تلو الأخرى.
      fail-fast: false
      matrix:
        package:
          - mobile/packages/dalil_core
          - mobile/apps/admin
          - mobile/apps/merchant
          - mobile/apps/user
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      # التنسيق تنبيه لا حاجز. اختلاف مسافة لا يجب أن يمنع نشر إصلاح.
      - name: Format check
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed . || echo "::warning::ملفات تحتاج dart format ."

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            flutter test
          else
            echo "لا توجد اختبارات في ${{ matrix.package }}"
          fi

  backend:
    runs-on: ubuntu-latest
    env:
      # الإعدادات تقرأ من البيئة. بدون هذه، manage.py check يفشل
      # قبل أن يفحص أي شيء.
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: 'False'
      DATABASE_URL: sqlite:///ci.sqlite3
      ALLOWED_HOSTS: '*'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System check
        working-directory: backend
        run: python manage.py check

      - name: Migrations are complete
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        working-directory: backend
        run: python manage.py test --noinput
